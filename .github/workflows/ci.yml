name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phishguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL failed to start"
          exit 1
      - name: Run Alembic migrations
        env:
          PHISHGUARD_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard
          PHISHGUARD_SECRET_KEY: test-secret-key-for-ci-testing-purposes-only-32chars
          PHISHGUARD_TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          PHISHGUARD_DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard"           PHISHGUARD_SECRET_KEY="test-secret-key-for-ci-testing-purposes-only-32chars"           PHISHGUARD_TOTP_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="           python -m alembic upgrade head
      - name: Run integration tests on PostgreSQL
        env:
          PHISHGUARD_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard
          PHISHGUARD_SECRET_KEY: test-secret-key-for-ci-testing-purposes-only-32chars
          PHISHGUARD_TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          PHISHGUARD_DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard"           PHISHGUARD_SECRET_KEY="test-secret-key-for-ci-testing-purposes-only-32chars"           PHISHGUARD_TOTP_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="           python -m pytest tests/test_integration.py -v --tb=long 2>&1 | tee test_integration_output.txt
      - name: Run PostgreSQL-specific tests
        if: always()
        env:
          PHISHGUARD_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard
          PHISHGUARD_SECRET_KEY: test-secret-key-for-ci-testing-purposes-only-32chars
          PHISHGUARD_TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          PHISHGUARD_DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard"           PHISHGUARD_SECRET_KEY="test-secret-key-for-ci-testing-purposes-only-32chars"           PHISHGUARD_TOTP_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="           python -m pytest tests/test_postgresql.py -v --tb=long 2>&1 | tee test_postgresql_output.txt
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test_integration_output.txt
            test_postgresql_output.txt
      - name: Test Alembic downgrade/upgrade
        env:
          PHISHGUARD_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard
          PHISHGUARD_SECRET_KEY: test-secret-key-for-ci-testing-purposes-only-32chars
          PHISHGUARD_TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          PHISHGUARD_DATABASE_URL="postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard"           PHISHGUARD_SECRET_KEY="test-secret-key-for-ci-testing-purposes-only-32chars"           PHISHGUARD_TOTP_ENCRYPTION_KEY="MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="           python -m alembic downgrade -1 && python -m alembic upgrade head
      - name: Verify constraints and indexes
        env:
          PHISHGUARD_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/phishguard
          PHISHGUARD_SECRET_KEY: test-secret-key-for-ci-testing-purposes-only-32chars
          PHISHGUARD_TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ users" 2>&1 | tee verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ sessions" 2>&1 | tee -a verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ analyses" 2>&1 | tee -a verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ analysis_results" 2>&1 | tee -a verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ api_usage" 2>&1 | tee -a verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ activity_logs" 2>&1 | tee -a verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ system_config" 2>&1 | tee -a verify_output.txt
          PGPASSWORD=postgres psql -h localhost -U postgres -d phishguard -c "\d+ revoked_refresh_tokens" 2>&1 | tee -a verify_output.txt
      - name: Upload verify logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: verify_output.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
