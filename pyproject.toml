[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phishguard-ci-api"
version = "0.1.0"
description = "Minimal local API foundation for PhishGuard CI Agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "email-validator>=2.1,<3.0",
    "python-slugify>=8.0,<9.0",
    "pyotp>=2.9,<3.0",
    "structlog>=24.0,<25.0",
    "greenlet>=3.0,<4.0",
    "bcrypt>=4.0,<5.0",
    "cryptography>=42.0,<43.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "faker>=30.0,<31.0",
    "types-python-jose>=3.3,<4.0",
    "types-passlib>=1.7,<2.0",
    "types-requests>=2.31,<3.0",
    "aiosqlite>=0.21,<1.0",
    "asgi-lifespan>=2.1,<3.0",
    "bcrypt>=4.0,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends in argument defaults - standard FastAPI pattern
    "B904",  # raise from - not critical
    "E501",  # Line too long - allow for complex patterns
    "B007",  # Unused loop variable - intentional
    "F841",  # Unused variable - intentional in some cases
    "UP042",  # StrEnum - Python 3.11+, we're on 3.12
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "postgresql: marks tests requiring PostgreSQL (skipped without PG env)",
]
